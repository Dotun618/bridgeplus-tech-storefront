kind = "web"
previewPath = "/"
title = "BridgePlus Tech Storefront"
description = "A responsive BridgePlus Tech device storefront with searchable categories, shopping cart, and WhatsApp-assisted order checkout."
version = "1.0.0"
id = "artifacts/bridgeplus-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25046

[services.development]
run = "pnpm --filter @workspace/bridgeplus-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bridgeplus-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/bridgeplus-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25046"
BASE_PATH = "/"
